    <symbol id="sw-procedure" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M6.6 5.6v4.8L10.6 8z"/></symbol>
    <symbol id="sw-function" viewBox="0 0 16 16"><path d="M5 2.5C2.8 5 2.8 11 5 13.5M11 2.5c2.2 2.5 2.2 8.5 0 11M6.5 6l3 4M9.5 6l-3 4"/></symbol>
