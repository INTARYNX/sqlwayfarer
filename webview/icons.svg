<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <!-- SQL Wayfarer icons: 16x16 grid, drawn with the current text colour (stroke
         set by .sw-icon in the stylesheets). One source, injected in the panel and
         in the sidebar (see panels/iconSprite.js); use them through swIcon()
         (webview/icons.js). Every shape is centred on (8, 8) by construction, so
         an icon alone in a button needs no correction - except the run triangle,
         centred on its centre of mass, which is what the eye reads as the middle. -->
    <symbol id="sw-table" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M6.5 6.5V13"/></symbol>
