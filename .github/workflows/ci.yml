name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The Actions settings of this repository do not allow the actions of the
# other repositories. A workflow that refers to one - actions/checkout,
# actions/setup-node - fails before its first job exists: the run is
# "startup_failure", with no job, no log and no message, whatever the
# workflow file says. This was measured, one action at a time.
#
# The code is therefore fetched with git, and the Node of the runner is used.
# When the setting allows the actions again, the "The code" step of each job
# can go back to actions/checkout, and a setup-node step can pin the version
# of Node.

jobs:
  # The fast gate: lint and the unit tests that need no VS Code. Runs in
  # seconds, so it is the one that gives a quick answer on a pull request.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

  # The full gate: the same tests, in a real VS Code. Needs a display, hence
  # xvfb-run.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - run: xvfb-run -a npm test

  # The webview is where the business code of the extension lives. Its tests
  # drive a real browser against the real page.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  # The artefact is never checked by the tests above: a webpack mistake, or a
  # file missing from the .vsix, would only show up on a user's machine. This
  # job builds the bundle and looks at what would be published.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - run: npm run build

      # The webview is loaded as plain <script> tags, not bundled: a pattern
      # that excludes it would ship an extension with an empty page, with no
      # error anywhere. The same goes for the extension bundle itself.
      - name: The published package keeps what it needs
        run: |
          set -e
          files=$(npx vsce ls)
          for required in \
            dist/extension.js \
            dist/parseColumnsWorker.js \
            dist/webview/sqlEditor.js \
            webview/index.html \
            webview/main.js \
            webview/styles.css \
            package.json
          do
            echo "$files" | grep -qx "$required" || { echo "MISSING from the package: $required"; exit 1; }
          done
          for unwanted in \
            test/ \
            database/ \
            panels/ \
            webview-build/ \
            deploy.ps1 \
            commit.ps1
          do
            if echo "$files" | grep -q "^$unwanted"; then echo "SHOULD NOT be published: $unwanted"; exit 1; fi
          done
          echo "the package holds what it needs"

  # The dependencies of the extension and of its build. The audit is not
  # blocking yet: the known advisories are in the test toolchain and in a
  # transitive dependency of the SQL Server driver, and both need a major
  # upgrade. Failing the build on them would only teach everyone to ignore it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - run: npm audit --audit-level=high
        continue-on-error: true

  # The tests that need a real SQL Server. They are opt-in (they read the
  # connection from SQLWAYFARER_TEST_SQL) and they create the databases they
  # need, so a throwaway instance is enough.
  sql-integration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Sqlwayfarer2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Sqlwayfarer2026 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      SQLWAYFARER_TEST_SQL: '{"server":"localhost","user":"sa","password":"Sqlwayfarer2026","database":"master","options":{"trustServerCertificate":true,"encrypt":false}}'
    steps:
      - name: The code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD

      - run: npm ci

      - name: The live tests
        run: npx mocha --ui tdd "test/live*.test.js" --timeout 600000
